name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres service container — Neon'a bağlanmak yerine izole, soğuk başlatmasız DB.
    # Migrations standart PostgreSQL SQL kullanır; Neon'a özgü özellik yok.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menti_mentor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Service container URL — izole, ephemeral test DB (Neon DEĞİL).
      # TEST_DATABASE_URL: fail-safe guard (tests/helpers/assertTestDatabase.ts) için
      # açık işaret; testlerin canlı DB yerine bu container'ı kullandığını garantiler.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/menti_mentor_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/menti_mentor_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc öncesi Prisma client'ı üret — aksi takdirde @prisma/client tipleri eksik olur.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      # globalSetup: warm-up SELECT 1 + migrateWithRetry + vitest suite (72 test).
      # Service container health-check garantili olduğundan warm-up ilk denemede geçer.
      - name: Run tests
        run: npx vitest run

  # KR-16: Canlı imajın açılışı internete ve değişken Prisma sürümüne bağlı olmasın.
  # Kanıt: (a) ağsız konteynerde Prisma CLI + schema engine hazır, sürüm lockfile ile aynı;
  # (b) imajdaki CLI gerçek migration'ları boş (CI'ın geçici) Postgres'ine uygular.
  docker-prisma:
    name: Docker imajı — Prisma CLI ağsız
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menti_mentor_image_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: İmajı derle
        run: docker build -t menti-backend:ci --build-arg GIT_SHA=${{ github.sha }} .

      - name: Ağsız — Prisma CLI sürümü ve motorlar
        run: |
          set -o pipefail
          docker run --rm --network none menti-backend:ci ./node_modules/.bin/prisma --version | tee prisma-version.txt
          expected=$(node -p "require('./package-lock.json').packages['node_modules/prisma'].version")
          echo "lockfile prisma sürümü: $expected"
          grep -E "^prisma +: ${expected}$" prisma-version.txt
          grep -E "^Schema Engine +: schema-engine-cli " prisma-version.txt

      - name: migrate deploy — boş test DB'sine gerçek migration'lar
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/menti_mentor_image_check \
            menti-backend:ci ./node_modules/.bin/prisma migrate deploy
