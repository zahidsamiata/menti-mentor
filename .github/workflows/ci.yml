name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres service container — Neon'a bağlanmak yerine izole, soğuk başlatmasız DB.
    # Migrations standart PostgreSQL SQL kullanır; Neon'a özgü özellik yok.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menti_mentor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Service container URL — tests/globalSetup.ts bunu alır (dotenv .env'i override etmez).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/menti_mentor_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc öncesi Prisma client'ı üret — aksi takdirde @prisma/client tipleri eksik olur.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      # globalSetup: warm-up SELECT 1 + migrateWithRetry + vitest suite (72 test).
      # Service container health-check garantili olduğundan warm-up ilk denemede geçer.
      - name: Run tests
        run: npx vitest run
